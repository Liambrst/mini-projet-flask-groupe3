{% extends "base.html" %}

{% block title %}Détail{% endblock %}

{% block content %}

<h2>{{ element.reference }}</h2>

<div class="detail">

    <p>
        {{ element.titre }}
    </p>

    <p>
        <strong>Disponibilité :</strong>
        {{ element.disponibilite }}
    </p>

</div>

<a href="{{ url_for('index') }}">
    ← Retour à la liste
</a>

{% endblock %}
